<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrubber Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="demo.css" />
</head>

<body>
  <main class="console">
    <div class="blueprint-grid" aria-hidden="true">
      <span class="grid-rule vertical rule-left"></span>
      <span class="grid-rule vertical rule-right"></span>
    </div>
    <header class="system-bar">
      <p class="system-id">Navigate frame by frame with the arrow buttons, keyboard arrow keys, or hovering over the video.</p>
    </header>

    <section class="scrubber" aria-label="Synchronized visual record">
      <span class="grid-rule horizontal rule-top" aria-hidden="true"></span>
      <span class="grid-rule horizontal rule-bottom" aria-hidden="true"></span>
      <article class="panel video-panel">
        <header class="panel-header">
          <h1>Video output</h1>
          <output id="frameReadout" class="data-readout" aria-live="off">FRAME-00000</output>
        </header>

        <div class="video-stage">
          <video id="video" src="../moonlight-beginning-clipped_1_1.mp4" muted autoplay playsinline preload="metadata"></video>
          <div id="hoverSurface" class="hover-surface" role="slider" tabindex="0" aria-label="Video timeline"
            aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="Frame 0"></div>
          <div class="screen-treatment" aria-hidden="true"></div>
          <div class="track" aria-hidden="true">
            <div id="markers" class="markers"></div>
            <div id="progress" class="progress"></div>
          </div>
        </div>

        <footer class="panel-footer">
          <button id="playPause" class="terminal-button frame-button" type="button" aria-label="Play video"
            aria-pressed="false"><span id="playPauseIcon" aria-hidden="true">▶</span></button>
          <output id="timeReadout" class="data-readout">00:00:00.00</output>
          <div class="frame-controls" aria-label="Frame controls">
            <button id="previousFrame" class="terminal-button frame-button" type="button"
              aria-label="Previous frame"><span aria-hidden="true">←</span> <span class="sr-only">Previous
                frame</span></button>
            <button id="nextFrame" class="terminal-button frame-button" type="button" aria-label="Next frame"><span
                class="sr-only">Next frame</span> <span aria-hidden="true">→</span></button>
          </div>
        </footer>
      </article>

      <article class="panel still-panel">
        <header class="panel-header">
          <h2>Median composite</h2>
          <output id="stillReadout" class="data-readout" aria-live="polite">FACE-00000</output>
        </header>

        <div class="still-stage">
          <canvas id="stillCanvas" width="320" height="240" role="img"
            aria-label="Synchronized median composite"></canvas>
          <div class="screen-treatment" aria-hidden="true"></div>
        </div>

        <footer class="panel-footer still-footer">
          <div class="frame-controls" aria-label="Still controls">
            <button id="previousStill" class="terminal-button frame-button" type="button"><span
                aria-hidden="true">←</span> <span class="sr-only">Previous identified face</span></button>
            <button id="nextStill" class="terminal-button frame-button" type="button"><span class="sr-only">Next
                identified face</span><span aria-hidden="true">→</span></button>
          </div>
        </footer>
      </article>

    </section>
  </main>
  <script src="demo.js?v=20260812-9"></script>
</body>

</html>
